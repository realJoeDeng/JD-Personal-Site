<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Joe Deng personal website" />
    <title>Joe Deng | Personal Website</title>
    <style>
      .life-reel-panel{position:absolute;inset:0;background:#071018;overflow:hidden;pointer-events:none;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .life-reel-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;transform:scale(1.06);filter:brightness(.42) saturate(.70) contrast(1.06)}
      .life-reel-panel:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,11,18,.94) 0%,rgba(7,16,24,.66) 34%,rgba(7,16,24,.40) 58%,rgba(7,16,24,.84) 100%);z-index:1}
      .life-reel-panel:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 22%,rgba(216,184,120,.16),transparent 34%),radial-gradient(circle at 15% 70%,rgba(91,124,153,.13),transparent 38%),linear-gradient(0deg,rgba(5,11,18,.92),transparent 47%,rgba(5,11,18,.50));z-index:2}
      .life-reel-grain{position:absolute;inset:0;z-index:3;opacity:.11;mix-blend-mode:soft-light;background-image:radial-gradient(rgba(255,255,255,.55) .6px,transparent .85px);background-size:3px 3px}
      .life-reel-copy{position:absolute;left:6.5vw;top:22vh;z-index:5;max-width:30rem;color:#fff}.life-reel-kicker{font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:rgba(255,255,255,.58);margin-bottom:1.5rem}.life-reel-dash{width:1.5rem;height:1px;background:rgba(216,184,120,.72);margin-bottom:2rem}.life-reel-title{font-size:clamp(2.25rem,3.05vw,3.15rem);line-height:1.5;letter-spacing:.12em;font-weight:300;color:rgba(255,255,255,.90)}.life-reel-sub{margin-top:2.15rem;font-size:clamp(.88rem,1vw,1rem);line-height:1.95;letter-spacing:.08em;color:rgba(255,255,255,.60)}.life-reel-en{margin-top:1.8rem;font-size:.9rem;letter-spacing:.08em;color:rgba(255,255,255,.62)}
      .life-reel-stage{position:absolute;left:34vw;right:0;top:14vh;bottom:18vh;z-index:5;pointer-events:auto;cursor:default}.life-reel-stage-hint{position:absolute;right:9vw;bottom:-1.4rem;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.30)}
      .life-reel-frame{position:absolute;left:50%;top:50%;border-radius:15px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.035);box-shadow:0 28px 90px rgba(0,0,0,.36);overflow:hidden;backdrop-filter:blur(1px);transition:transform .55s cubic-bezier(.22,.8,.2,1),opacity .55s ease,filter .55s ease;border-color .55s ease;will-change:transform,opacity,filter}.life-reel-frame[data-shape="wide"]{width:340px;height:214px}.life-reel-frame[data-shape="panorama"]{width:390px;height:220px}.life-reel-frame[data-shape="square"]{width:270px;height:270px}.life-reel-frame[data-shape="portrait"]{width:198px;height:302px}.life-reel-frame[data-offset="0"]{z-index:10;opacity:1;filter:none;transform:translate(-50%,-50%) translateX(0) translateY(-8px) scale(1.18)}.life-reel-frame[data-offset="1"]{z-index:8;opacity:.72;filter:brightness(.82) saturate(.84);transform:translate(-50%,-50%) translateX(300px) translateY(14px) scale(.88)}.life-reel-frame[data-offset="2"]{z-index:7;opacity:.42;filter:brightness(.62) saturate(.72);transform:translate(-50%,-50%) translateX(530px) translateY(32px) scale(.70)}.life-reel-frame[data-offset="3"]{z-index:4;opacity:.18;filter:brightness(.46) saturate(.58);transform:translate(-50%,-50%) translateX(720px) translateY(36px) scale(.56)}.life-reel-frame[data-offset="-1"]{z-index:8;opacity:.66;filter:brightness(.78) saturate(.78);transform:translate(-50%,-50%) translateX(-285px) translateY(20px) scale(.84)}.life-reel-frame[data-offset="-2"]{z-index:6;opacity:.34;filter:brightness(.55) saturate(.65);transform:translate(-50%,-50%) translateX(-495px) translateY(38px) scale(.66)}.life-reel-frame[data-offset="-3"]{z-index:3;opacity:.12;filter:brightness(.42) saturate(.52);transform:translate(-50%,-50%) translateX(-655px) translateY(42px) scale(.54)}
      .life-reel-frame-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(18px) brightness(.55) saturate(.72);transform:scale(1.14);opacity:.56}.life-reel-frame-main{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center center;display:block;filter:contrast(.98) saturate(.92);opacity:.96}.life-reel-frame:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.38),transparent 42%,rgba(0,0,0,.12));pointer-events:none}.life-reel-frame[data-offset="0"]:after{background:linear-gradient(0deg,rgba(0,0,0,.34),transparent 48%,rgba(0,0,0,.08))}.life-reel-no,.life-reel-label,.life-reel-meta{position:absolute;z-index:2;font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.62);text-shadow:0 2px 12px rgba(0,0,0,.55)}.life-reel-no{left:.82rem;top:.78rem}.life-reel-label{right:.82rem;top:.78rem;text-transform:uppercase;color:rgba(255,255,255,.55);letter-spacing:.22em}.life-reel-meta{left:.82rem;bottom:.78rem;text-transform:uppercase;color:rgba(255,255,255,.52)}
      .life-reel-timeline{position:absolute;left:6.5vw;right:7vw;bottom:7vh;z-index:6;color:rgba(255,255,255,.46);pointer-events:auto}.life-reel-timeline-title{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.64);margin-bottom:1rem}.life-reel-track{position:relative;height:38px;cursor:pointer}.life-reel-line{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.18)}.life-reel-fill{position:absolute;left:0;top:50%;height:1px;width:var(--reel-progress,0%);background:rgba(243,230,208,.65);box-shadow:0 0 16px rgba(243,230,208,.28);transition:width .42s cubic-bezier(.22,.8,.2,1)}.life-reel-node{position:absolute;left:var(--reel-progress,0%);top:50%;width:8px;height:8px;border-radius:999px;background:#f3e6d0;box-shadow:0 0 18px rgba(243,230,208,.85);transform:translate(-50%,-50%);transition:left .42s cubic-bezier(.22,.8,.2,1)}.life-reel-mark{position:absolute;top:50%;transform:translate(-50%,-50%);appearance:none;border:0;background:transparent;padding:0;cursor:pointer}.life-reel-mark-dot{width:4px;height:4px;border-radius:999px;background:rgba(255,255,255,.30);transition:background .25s ease,box-shadow .25s ease,transform .25s ease}.life-reel-mark-num{margin-top:.75rem;font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.36);transition:color .25s ease}.life-reel-mark.is-active .life-reel-mark-dot{background:#f3e6d0;box-shadow:0 0 14px rgba(243,230,208,.72);transform:scale(1.25)}.life-reel-mark.is-active .life-reel-mark-num{color:rgba(255,255,255,.72)}.life-reel-count{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:.9rem;letter-spacing:.22em;color:rgba(255,255,255,.62)}
      @media(max-width:900px){.life-reel-copy{left:7vw;top:15vh;max-width:86vw}.life-reel-title{font-size:2rem}.life-reel-stage{left:0;right:0;top:48vh;bottom:18vh}.life-reel-frame[data-shape="wide"],.life-reel-frame[data-shape="panorama"]{width:260px;height:166px}.life-reel-frame[data-shape="square"]{width:210px;height:210px}.life-reel-frame[data-shape="portrait"]{width:150px;height:225px}.life-reel-frame[data-offset="1"]{transform:translate(-50%,-50%) translateX(190px) scale(.72)}.life-reel-frame[data-offset="-1"]{transform:translate(-50%,-50%) translateX(-190px) scale(.72)}.life-reel-frame[data-offset="2"],.life-reel-frame[data-offset="3"],.life-reel-frame[data-offset="-2"],.life-reel-frame[data-offset="-3"]{opacity:0}.life-reel-timeline{left:7vw;right:7vw;bottom:6vh}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__JOE_LINKEDIN_URL__ = "https://www.linkedin.com/in/jingyin-deng-006707233/";
      window.__JOE_EMAIL__ = "realjoedengigo@gmail.com";
      window.__lifeReelIndex = 1;
      window.__lifeReelWheelLock = false;

      function isChinesePage() {
        return document.body && document.body.innerText.indexOf("关于我") !== -1;
      }

      function applyPathTitleStyle(node, mode) {
        if (!node) return;
        if (mode === "cn") {
          node.style.fontSize = "clamp(1.45rem, 2.35vw, 2.05rem)";
          node.style.fontWeight = "650";
          node.style.lineHeight = "1.22";
          node.style.letterSpacing = "0.04em";
          node.style.color = "rgba(255, 255, 255, 0.96)";
          node.style.textTransform = "none";
        } else {
          node.style.fontSize = "1rem";
          node.style.fontWeight = "400";
          node.style.lineHeight = "1.5";
          node.style.letterSpacing = "0.42em";
          node.style.color = "rgba(216, 184, 120, 0.82)";
          node.style.textTransform = "uppercase";
        }
      }

      function polishStaticLabels() {
        var chinese = isChinesePage();
        var nodes = Array.prototype.slice.call(document.querySelectorAll("span, div"));
        nodes.forEach(function (node) {
          var text = (node.textContent || "").trim();
          if (text === "What It Shows") node.textContent = "Core Insight";
          if (text === "这说明什么") node.textContent = "核心洞察";
          if (chinese && (text === "From noise to usable judgment" || text === "FROM NOISE TO USABLE JUDGMENT")) {
            node.textContent = "从纷繁信息，到可用判断";
            applyPathTitleStyle(node, "cn");
          }
          if (!chinese && text === "从纷繁信息，到可用判断") {
            node.textContent = "FROM NOISE TO USABLE JUDGMENT";
            applyPathTitleStyle(node, "en");
          }
        });
      }

      function asset(path) {
        return "images/site-assets/" + path;
      }

      function lifeReelItems() {
        return [
          { img: "life-reel-01-stonehenge.webp", no: "01", label: "STONEHENGE", meta: "35MM", shape: "panorama" },
          { img: "life-reel-02-road.webp", no: "02", label: "ON THE ROAD", meta: "35MM  F/2.0", shape: "panorama" },
          { img: "life-reel-03-city.webp", no: "03", label: "IN THE CITY", meta: "ISO 400", shape: "wide" },
          { img: "life-reel-04-sea.webp", no: "04", label: "BY THE SEA", meta: "1/60", shape: "wide" },
          { img: "life-reel-05-silhouette.webp", no: "05", label: "NIGHT SONGS", meta: "50MM", shape: "wide" },
          { img: "life-reel-06-street.webp", no: "06", label: "SILENT MOMENTS", meta: "", shape: "panorama" }
        ];
      }

      function installLifeReel() {
        var life = document.getElementById("life");
        if (!life) return;
        var sticky = life.querySelector(":scope > div");
        if (!sticky || !sticky.children || sticky.children.length < 6) return;
        var panel = sticky.children[5];
        if (!panel) return;
        if (panel.dataset.lifeReelInstalled === "true") {
          updateLifeReelLanguage();
          updateLifeReelState(false);
          return;
        }
        panel.dataset.lifeReelInstalled = "true";
        panel.className = "absolute inset-0 bg-[#071018] pointer-events-none overflow-hidden";
        var items = lifeReelItems();
        panel.innerHTML = [
          '<div class="life-reel-panel">',
          '<img class="life-reel-bg" src="' + asset('life-reel-bg.webp') + '" alt="Life on the road" />',
          '<div class="life-reel-grain"></div>',
          '<div class="life-reel-copy">',
          '<div class="life-reel-kicker" data-reel-kicker></div>',
          '<div class="life-reel-dash"></div>',
          '<div class="life-reel-title" data-reel-title></div>',
          '<div class="life-reel-sub" data-reel-sub></div>',
          '<div class="life-reel-en" data-reel-en></div>',
          '</div>',
          '<div class="life-reel-stage" data-reel-stage>',
          items.map(function(item, i){ return reelFrame(item, i); }).join(''),
          '<div class="life-reel-stage-hint">wheel over images</div>',
          '</div>',
          '<div class="life-reel-timeline" data-reel-timeline><div class="life-reel-timeline-title">A Day in Pieces</div><div class="life-reel-track" data-reel-track><div class="life-reel-line"></div><div class="life-reel-fill"></div><div class="life-reel-node"></div>',
          items.map(function(item, i){ return timelineMark(item.no, i, items.length); }).join(''),
          '<div class="life-reel-count" data-reel-count>02 / 06</div></div></div>',
          '</div>'
        ].join('');
        bindLifeReelEvents();
        updateLifeReelLanguage();
        updateLifeReelState(false);
      }

      function reelFrame(item, i) {
        return '<div class="life-reel-frame" data-reel-frame data-index="' + i + '" data-shape="' + item.shape + '"><img class="life-reel-frame-bg" src="' + asset(item.img) + '" alt="" aria-hidden="true" /><img class="life-reel-frame-main" src="' + asset(item.img) + '" alt="Life reel ' + item.no + '" /><div class="life-reel-no">' + item.no + '</div><div class="life-reel-label">' + item.label + '</div>' + (item.meta ? '<div class="life-reel-meta">' + item.meta + '</div>' : '') + '</div>';
      }

      function timelineMark(no, i, total) {
        var left = total <= 1 ? 0 : (i / (total - 1)) * 86;
        return '<button type="button" class="life-reel-mark" data-reel-mark data-index="' + i + '" style="left:' + left + '%"><div class="life-reel-mark-dot"></div><div class="life-reel-mark-num">' + no + '</div></button>';
      }

      function normalizeOffset(offset, total) {
        var half = Math.floor(total / 2);
        if (offset > half) offset -= total;
        if (offset < -half) offset += total;
        return offset;
      }

      function setLifeReelIndex(index) {
        var total = lifeReelItems().length;
        window.__lifeReelIndex = ((index % total) + total) % total;
        updateLifeReelState(true);
      }

      function updateLifeReelState(animate) {
        var panel = document.querySelector(".life-reel-panel");
        if (!panel) return;
        var total = lifeReelItems().length;
        var active = window.__lifeReelIndex || 0;
        var progress = total <= 1 ? 0 : (active / (total - 1)) * 86;
        panel.style.setProperty("--reel-progress", progress + "%");
        Array.prototype.slice.call(panel.querySelectorAll("[data-reel-frame]")).forEach(function(frame) {
          var i = Number(frame.getAttribute("data-index"));
          frame.setAttribute("data-offset", String(normalizeOffset(i - active, total)));
        });
        Array.prototype.slice.call(panel.querySelectorAll("[data-reel-mark]")).forEach(function(mark) {
          var i = Number(mark.getAttribute("data-index"));
          mark.classList.toggle("is-active", i === active);
        });
        var count = panel.querySelector("[data-reel-count]");
        if (count) count.textContent = String(active + 1).padStart(2, "0") + " / " + String(total).padStart(2, "0");
      }

      function updateLifeReelLanguage() {
        var panel = document.querySelector(".life-reel-panel");
        if (!panel) return;
        var chinese = isChinesePage();
        var kicker = panel.querySelector("[data-reel-kicker]");
        var title = panel.querySelector("[data-reel-title]");
        var sub = panel.querySelector("[data-reel-sub]");
        var en = panel.querySelector("[data-reel-en]");
        if (chinese) {
          if (kicker) kicker.textContent = "Life / On the Road";
          if (title) title.innerHTML = "我把远方留给路，<br />把情绪留给歌，<br />把时间留给照片。";
          if (sub) sub.innerHTML = "每一段路，都是一次与世界的对话。<br />摄影、音乐、文字，是我记录感受的方式。";
          if (en) en.textContent = "Keep walking, keep recording.";
        } else {
          if (kicker) kicker.textContent = "Life / Travel / Photography / Music";
          if (title) title.innerHTML = "I leave distance to the road,<br />feeling to the songs,<br />and time to photographs.";
          if (sub) sub.innerHTML = "Every road is a quiet conversation with the world.<br />Photography, music, and words are how I keep the feeling.";
          if (en) en.textContent = "Keep walking, keep recording.";
        }
      }

      function bindLifeReelEvents() {
        var stage = document.querySelector("[data-reel-stage]");
        var track = document.querySelector("[data-reel-track]");
        if (stage && stage.dataset.bound !== "true") {
          stage.dataset.bound = "true";
          stage.addEventListener("wheel", function(e) {
            e.preventDefault();
            e.stopPropagation();
            if (window.__lifeReelWheelLock) return;
            window.__lifeReelWheelLock = true;
            var direction = e.deltaY > 0 ? 1 : -1;
            setLifeReelIndex((window.__lifeReelIndex || 0) + direction);
            window.setTimeout(function(){ window.__lifeReelWheelLock = false; }, 360);
          }, { passive: false });
        }
        if (track && track.dataset.bound !== "true") {
          track.dataset.bound = "true";
          track.addEventListener("click", function(e) {
            e.preventDefault();
            e.stopPropagation();
            var mark = e.target.closest ? e.target.closest("[data-reel-mark]") : null;
            if (mark) {
              setLifeReelIndex(Number(mark.getAttribute("data-index")));
              return;
            }
            var rect = track.getBoundingClientRect();
            var x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
            var total = lifeReelItems().length;
            setLifeReelIndex(Math.round((x / rect.width) * (total - 1)));
          }, true);
        }
      }

      function enhancePage() {
        polishStaticLabels();
        installLifeReel();
      }

      document.addEventListener("click", function (event) {
        var target = event.target;
        var node = target && target.closest ? target.closest("span, div, a") : null;
        if (node && (node.textContent || "").trim() === "LinkedIn") {
          event.preventDefault();
          window.open(window.__JOE_LINKEDIN_URL__, "_blank", "noopener,noreferrer");
        }
        window.setTimeout(enhancePage, 120);
        window.setTimeout(enhancePage, 360);
      }, true);

      document.addEventListener("submit", function (event) {
        var form = event.target;
        if (!form || !form.closest || !form.closest("#contact")) return;
        event.preventDefault();
        event.stopPropagation();
        if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        var inputs = form.querySelectorAll("input");
        var textarea = form.querySelector("textarea");
        var name = inputs[0] ? inputs[0].value.trim() : "";
        var email = inputs[1] ? inputs[1].value.trim() : "";
        var subject = inputs[2] && inputs[2].value.trim() ? inputs[2].value.trim() : "Message from personal website";
        var message = textarea ? textarea.value.trim() : "";
        var body = "Name: " + name + "\n" + "Email: " + email + "\n\n" + "Message:\n" + message;
        window.location.href = "mailto:" + window.__JOE_EMAIL__ + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
      }, true);

      window.addEventListener("load", function () {
        window.setTimeout(enhancePage, 250);
        window.setTimeout(enhancePage, 900);
        var container = document.querySelector("[data-scroll-container]");
        if (container) {
          container.addEventListener("scroll", function () {
            window.requestAnimationFrame(enhancePage);
          }, { passive: true });
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
